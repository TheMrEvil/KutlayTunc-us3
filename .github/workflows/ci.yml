name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build first so each package's emitted types (dist/*.d.ts) exist before
      # cross-package typecheck resolves them
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
